schemaVersion: "1.0"
policyVersion: 1
roles:
  admin-role:
    description: "Admin role with access to everything"
    allow: ["*"]
    deny: []
    maxClassification: "secret"
    
  standard-role:
    description: "Standard agent role with specified capabilities"
    allow: ["get_current_datetime", "send_email"]
    deny: []
    maxClassification: "secret"
    
  restricted-role:
    description: "Restricted role strictly limited to specific tools"
    allow: ["get_current_datetime"]
    deny: ["send_email"]
    maxClassification: "public"

classificationLevels:
  - name: public
    description: "Publicly shareable info"
    externalShareAllowed: true
  - name: secret
    description: "Internal confidential data"
    externalShareAllowed: false
